<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mars Storm Replay</title>
<meta name="description" content="A storybook Mars mission for kids aged 7-12: keep 4 astronauts safe for 10 sols through a real May 2024 space storm, replayed from NASA DONKI data.">
<link rel="stylesheet" href="src/story.css">
</head>
<body>
<!-- hand-drawn look: a tiny wobble filter used by the pictures in src/art.js -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
</svg>

<header class="topbar">
  <h1><span data-i18n="app.t1">Mars</span> <span class="accent" data-i18n="app.t2">Storm</span> <span data-i18n="app.t3">Replay</span></h1>
  <div class="tools">
    <span class="realdata" id="dataBadge">loading…</span>
    <button class="chip" id="btnLang" type="button" lang="az">🌐</button>
    <button class="chip" id="btnSound" type="button" aria-pressed="false">🔇 Sound: off</button>
    <button class="chip" id="btnTeacher" type="button" data-i18n="top.teacher">📡 For teachers</button>
  </div>
</header>

<main>
  <div id="banner" class="banner hidden"></div>

  <!-- 1. Intro: 4 storybook pages, one idea each -->
  <section id="scrIntro" aria-live="polite"></section>

  <!-- 2. Quiz: one question per screen (before and after) -->
  <section id="scrQuiz" class="hidden" aria-live="polite"></section>

  <!-- 3. The mission: one sol at a time -->
  <section id="scrGame" class="hidden">
    <div class="panel stones tilt-r" id="stones" aria-label="Your 10 sols. Red stones are real storm days."></div>
    <div class="gamegrid">
      <div class="panel scene tilt-l" id="scene">
        <span class="caption tag" id="sceneTag"></span>
        <div class="dust" id="dust"></div>
        <div class="zap" aria-hidden="true"><b>ZAP!</b></div>
      </div>
      <div class="panel roviside tilt-r">
        <div class="bubble" id="roviSay" aria-live="polite"></div>
        <div id="roviArt"></div>
      </div>
    </div>
    <div class="panel earth tilt-r" id="earthPanel" aria-live="polite"></div>
    <div class="panel event" id="eventCard"></div>
    <div class="bottomgrid">
      <div class="panel powerpanel tilt-l" id="powerPanel"></div>
      <div class="panel report hidden tilt-l" id="reportPanel" aria-live="polite"></div>
      <div class="panel crewpanel halftone tilt-r" id="crewPanel"></div>
    </div>
  </section>

  <!-- 4. End of mission -->
  <section id="scrEnd" class="hidden"></section>

  <!-- 5. Quiz results -->
  <section id="scrResults" class="hidden"></section>
</main>

<!-- printable Junior Astronaut certificate (shown after a win) -->
<div id="cert" class="hidden"></div>

<!-- for teachers and judges: where every number comes from -->
<dialog id="dlgTeacher" aria-labelledby="teacherTitle">
  <div class="row" style="justify-content:space-between">
    <h2 id="teacherTitle" class="hand" data-i18n="teacher.title">NASA data sources</h2>
    <button class="chip" id="btnCloseTeacher" type="button" data-i18n="btn.close">Close</button>
  </div>
  <div id="srcBody"></div>
</dialog>

<script src="data/events.js"></script>
<script src="locales/locales.js"></script>
<script src="src/i18n.js"></script>
<script src="src/game.js"></script>
<script src="src/art.js"></script>
<script src="src/sound.js"></script>
<script src="src/ui.js"></script>
<!-- Optional 3D diorama (visual only; local three.js; falls back to the 2D picture) -->
<script src="data/gale_heightmap.js"></script>
<script src="vendor/three.min.js"></script>
<script src="src/scene3d.js"></script>
</body>
</html>
